<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f5e2e2; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 1.5rem; }
  .m { max-width: 420px; width: 100%; background: #fff7f7; border-radius: 1.5rem; box-shadow: 0 15px 35px rgba(60,10,10,.18); padding: 2.5rem 2rem; text-align: center; }
  h1 { color: #5a0f0f; border-bottom: 2px solid #d4b0b0; padding-bottom: .7rem; margin-bottom: 1.8rem; }
  a.btn { display: block; width: 100%; padding: .8rem; font-size: 1rem; font-weight: 600; border-radius: 2rem; text-decoration: none; margin-top: 1rem; transition: .2s; }
  .login { background: #800020; color: #fff; }
  .login:hover { background: #5c0017; }
  .register { background: #fff; color: #800020; border: 2px solid #800020; }
  .register:hover { background: #fde3e3; }
  p { color: #6b2020; margin-bottom: .5rem; }
</style>
</head>
<body>
<div class="m">
  <h1>Welcome</h1>
  <p>Please choose an option</p>
  <a href="login.html" class="btn login">Login</a>
  <a href="register.html" class="btn register">Register</a>
</div>
</body>
</html>
